<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <div class='container'>
    <h1>Expense Tracker</h1>
    <div class='cards'>
      <div class='card total'><h3>Total</h3><p>$1200.00</p></div>
      <div class='card'><h3>Food</h3><p>$1200.00</p></div>
      <div class='card'><h3>Transport</h3><p>$0.00</p></div>
      <div class='card'><h3>Shopping</h3><p>$0.00</p></div>
      <div class='card'><h3>Bills</h3><p>$0.00</p></div>
      <div class='card'><h3>Other</h3><p>$0.00</p></div>
    </div>
    <table>
      <tr><th>#</th><th>Title</th><th>Category</th><th>Amount</th></tr>
      <tr><td>1</td><td>Food</td><td>Food</td><td>$1200.00</td></tr>
    </table>
  </div>
</body>
</html>
