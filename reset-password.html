<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#142b4a">
    <title>Choose a new password · Attendify Pro</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script type="module" src="js/auth.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-layout auth-layout-centered">
      <section class="auth-main">
        <div class="auth-card">
          <a class="brand auth-mobile-brand" href="login.html" aria-label="Attendify Pro">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-copy"><strong>Attendify</strong><span>PRO</span></span>
          </a>
          <p class="eyebrow">ACCOUNT RECOVERY</p>
          <h2>Choose a new password</h2>
          <p class="auth-description">Choose a secure password you haven’t used before.</p>
          <p class="auth-message" data-auth-message role="status" aria-live="polite" hidden></p>
          <form class="auth-form" data-password-update-form>
            <label class="auth-field"><span>New password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
            <label class="auth-field"><span>Confirm new password</span><input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label>
            <button class="button button-primary auth-submit" type="submit">Update password</button>
          </form>
          <p class="auth-switch"><a href="login.html">Return to sign in</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
